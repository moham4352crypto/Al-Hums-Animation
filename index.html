<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Journey of Mohamed - Extended 3D Storyboard</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        #story-ui {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 900px;
            background: rgba(12, 16, 24, 0.92);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(0, 198, 255, 0.4);
            border-radius: 12px;
            padding: 20px 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        #scene-title {
            margin: 0;
            font-size: 22px;
            color: #ffcc00;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
        }

        #scene-description {
            margin: 0;
            font-size: 15px;
            line-height: 1.6;
            color: #ddd;
            min-height: 48px;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 12px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00c6ff;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            background: #00c6ff;
            color: #000;
            box-shadow: 0 0 12px #00c6ff;
        }

        #scene-counter {
            font-family: monospace;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="story-ui">
        <h2 id="scene-title">Loading...</h2>
        <p id="scene-description">Initializing environment...</p>
        <div class="controls-row">
            <span id="scene-counter">SCENE 1 / 8</span>
            <div class="btn-group">
                <button onclick="prevScene()">◄ Prev</button>
                <button id="autoplay-btn" onclick="toggleAutoPlay()">Autoplay: ON</button>
                <button onclick="nextScene()">Next ►</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec0ee);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const sun = new THREE.DirectionalLight(0xffffff, 1.3);
        sun.position.set(50, 100, 50);
        sun.castShadow = true;
        scene.add(sun, new THREE.AmbientLight(0x808080));

        const worldGround = new THREE.Mesh(
            new THREE.BoxGeometry(300, 2, 300),
            new THREE.MeshStandardMaterial({ color: 0x448833, roughness: 0.8 })
        );
        worldGround.position.y = -1;
        worldGround.receiveShadow = true;
        scene.add(worldGround);

        const grid = new THREE.GridHelper(300, 60, 0x225522, 0x336633);
        grid.position.y = 0.01;
        scene.add(grid);

        // Natural R6 Rigging with Stick/Sword natural grip
        function createRobloxR6(shirtColor = 0x00a2ff, legColor = 0x111111, headColor = 0xf5cd2f) {
            const avatar = new THREE.Group();
            const torsoMat = new THREE.MeshStandardMaterial({ color: shirtColor });
            const headMat = new THREE.MeshStandardMaterial({ color: headColor });
            const legMat = new THREE.MeshStandardMaterial({ color: legColor });
            const armMat = new THREE.MeshStandardMaterial({ color: shirtColor });
            const steelMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.85, roughness: 0.2 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.3 });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), torsoMat);
            torso.position.y = 3;
            avatar.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), headMat);
            head.position.y = 4.6;
            avatar.add(head);

            const leftArmGroup = new THREE.Group();
            leftArmGroup.position.set(-1.5, 4, 0);
            const leftArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), armMat);
            leftArm.position.y = -1;
            leftArmGroup.add(leftArm);
            avatar.add(leftArmGroup);

            const rightArmGroup = new THREE.Group();
            rightArmGroup.position.set(1.5, 4, 0);
            const rightArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), armMat);
            rightArm.position.y = -1;
            rightArmGroup.add(rightArm);

            // Stick/Sword Grip attached naturally at hand
            const swordGroup = new THREE.Group();
            swordGroup.position.set(0, -1.8, 0.2); 
            swordGroup.rotation.x = Math.PI / 2.2; // Holds sword pointing forward like a stick/bat

            const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.8), new THREE.MeshStandardMaterial({ color: 0x333333 }));
            handle.position.y = 0;
            swordGroup.add(handle);

            const hilt = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.12, 0.25), goldMat);
            hilt.position.y = 0.4;
            swordGroup.add(hilt);

            const blade = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.6, 0.3), steelMat);
            blade.position.y = 1.7;
            swordGroup.add(blade);

            swordGroup.visible = false;
            rightArmGroup.add(swordGroup);
            avatar.add(rightArmGroup);

            const leftLegGroup = new THREE.Group();
            leftLegGroup.position.set(-0.55, 2, 0);
            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 1), legMat);
            leftLeg.position.y = -1;
            leftLegGroup.add(leftLeg);
            avatar.add(leftLegGroup);

            const rightLegGroup = new THREE.Group();
            rightLegGroup.position.set(0.55, 2, 0);
            const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 1), legMat);
            rightLeg.position.y = -1;
            rightLegGroup.add(rightLeg);
            avatar.add(rightLegGroup);

            avatar.rig = { leftArmGroup, rightArmGroup, leftLegGroup, rightLegGroup, swordGroup };
            avatar.walkCycleTime = 0;
            return avatar;
        }

        function animateBotWalking(actor, targetX, targetZ, speed = 0.08) {
            const dx = targetX - actor.position.x;
            const dz = targetZ - actor.position.z;
            const dist = Math.hypot(dx, dz);

            if (dist > 0.4) {
                actor.rotation.y = Math.atan2(dx, dz);
                actor.position.x += (dx / dist) * speed;
                actor.position.z += (dz / dist) * speed;

                actor.walkCycleTime += 0.15;
                const swing = Math.sin(actor.walkCycleTime) * 0.6;
                actor.rig.leftArmGroup.rotation.x = swing;
                actor.rig.rightArmGroup.rotation.x = -swing;
                actor.rig.leftLegGroup.rotation.x = -swing;
                actor.rig.rightLegGroup.rotation.x = swing;
                return true;
            } else {
                actor.rig.leftArmGroup.rotation.x = 0;
                actor.rig.rightArmGroup.rotation.x = 0;
                actor.rig.leftLegGroup.rotation.x = 0;
                actor.rig.rightLegGroup.rotation.x = 0;
                return false;
            }
        }

        const storyData = [
            {
                title: "1. A Childhood Amidst Cacao Fields",
                desc: "Mohamed walks to a giant cocoa tree, plucks a fresh cacao pod, and holds it in his hands to inspect his harvest.",
                camPos: [-10, 10, 24],
                camLookAt: [0, 4, 0],
                setup: () => {
                    worldGround.material.color.setHex(0x2d6a4f);
                    const mohamed = createRobloxR6(0x2a9d8f, 0x264653, 0xe9c46a);
                    mohamed.position.set(-14, 0, 4);
                    scene.add(mohamed);

                    const bigTree = new THREE.Mesh(
                        new THREE.CylinderGeometry(1.4, 2.0, 15),
                        new THREE.MeshStandardMaterial({ color: 0x4a2e1b })
                    );
                    bigTree.position.set(0, 7.5, 0);
                    const leaves = new THREE.Mesh(
                        new THREE.SphereGeometry(7, 12, 12),
                        new THREE.MeshStandardMaterial({ color: 0x1b4332, roughness: 0.6 })
                    );
                    leaves.position.y = 8;
                    bigTree.add(leaves);
                    scene.add(bigTree);

                    for (let i = 0; i < 4; i++) {
                        const sideTree = bigTree.clone();
                        sideTree.scale.set(0.6, 0.6, 0.6);
                        sideTree.position.set((i - 2) * 12 + 4, 4.5, -12);
                        scene.add(sideTree);
                    }

                    const beanMat = new THREE.MeshStandardMaterial({ color: 0x6e3b12, roughness: 0.4 });
                    const bean = new THREE.Mesh(new THREE.SphereGeometry(0.7, 10, 10), beanMat);
                    bean.scale.set(0.6, 1.4, 0.6);
                    bean.position.set(-0.5, 7.0, 1.4);
                    scene.add(bean);

                    let grabbed = false;
                    let ticks = 0;
                    return {
                        actors: [mohamed, bigTree, bean],
                        update: () => {
                            ticks += 0.02;
                            const moving = animateBotWalking(mohamed, -1.2, 1.8, 0.06);
                            if (!moving) {
                                if (!grabbed) {
                                    mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 1.3;
                                    if (ticks > 2.5) {
                                        scene.remove(bean);
                                        mohamed.rig.rightArmGroup.add(bean);
                                        // Place bean clearly in hand
                                        bean.position.set(0, -2.0, 0.6);
                                        grabbed = true;
                                    }
                                } else {
                                    // Hold the cacao bean visibly up front with both hands
                                    mohamed.rotation.y = Math.PI / 4;
                                    mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2.2;
                                    mohamed.rig.rightArmGroup.rotation.y = -Math.PI / 6;
                                    mohamed.rig.leftArmGroup.rotation.x = -Math.PI / 2.5;
                                    mohamed.rig.leftArmGroup.rotation.y = Math.PI / 6;
                                }
                            }
                        }
                    };
                }
            },
            {
                title: "2. Ascension to Leadership",
                desc: "Mohamed hands out food bowls to villagers. Upon receiving their bowl, each villager walks off happy to make room for the next.",
                camPos: [0, 10, 22],
                camLookAt: [0, 4, 0],
                setup: () => {
                    worldGround.material.color.setHex(0xd4a373);

                    const castle = new THREE.Mesh(
                        new THREE.BoxGeometry(22, 14, 8),
                        new THREE.MeshStandardMaterial({ color: 0x8d99ae })
                    );
                    castle.position.set(0, 7, -10);
                    scene.add(castle);

                    const foodCauldron = new THREE.Mesh(
                        new THREE.CylinderGeometry(1.5, 1.2, 2, 12),
                        new THREE.MeshStandardMaterial({ color: 0x4a4e69, metalness: 0.8 })
                    );
                    foodCauldron.position.set(-2, 1, 0);
                    scene.add(foodCauldron);

                    const mohamed = createRobloxR6(0x2a9d8f, 0x1d3557);
                    mohamed.position.set(-0.5, 0, 0);
                    scene.add(mohamed);

                    const bowlMat = new THREE.MeshStandardMaterial({ color: 0xe9c46a });
                    const heldBowl = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.4, 0.5), bowlMat);
                    heldBowl.position.set(0, -1.8, 0.6);
                    mohamed.rig.rightArmGroup.add(heldBowl);

                    const villagers = [];
                    for (let i = 0; i < 5; i++) {
                        const villager = createRobloxR6(0xe9c46a, 0x264653);
                        villager.position.set(2.5 + i * 3.5, 0, 0.5);
                        
                        const vBowl = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.4, 0.5), bowlMat);
                        vBowl.position.set(0, -1.8, 0.6);
                        vBowl.visible = false;
                        villager.rig.leftArmGroup.add(vBowl);
                        villager.receivedBowl = vBowl;
                        villager.hasReceived = false;

                        scene.add(villager);
                        villagers.push(villager);
                    }

                    let activeIndex = 0;
                    let serveTimer = 0;

                    return {
                        actors: [mohamed, castle, foodCauldron, ...villagers],
                        update: () => {
                            serveTimer += 0.03;

                            mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 3 + Math.sin(serveTimer * 2) * 0.15;
                            mohamed.rig.rightArmGroup.rotation.y = -Math.PI / 6;

                            villagers.forEach((v, idx) => {
                                if (v.hasReceived) {
                                    // Walk off holding the bowl
                                    animateBotWalking(v, 14, 12, 0.06);
                                    v.receivedBowl.visible = true;
                                    v.rig.leftArmGroup.rotation.x = -Math.PI / 2.5;
                                } else {
                                    const queuePos = (idx - activeIndex);
                                    if (queuePos >= 0) {
                                        const targetX = queuePos * 2.8 + 1.8;
                                        const stillMoving = animateBotWalking(v, targetX, 0.5, 0.05);

                                        if (!stillMoving && queuePos === 0) {
                                            v.rotation.y = -Math.PI / 2;
                                            v.rig.leftArmGroup.rotation.x = -Math.PI / 2.5;
                                            if (serveTimer > 3.0) {
                                                v.hasReceived = true;
                                                v.receivedBowl.visible = true;
                                                activeIndex++;
                                                serveTimer = 0;
                                            }
                                        }
                                    }
                                }
                            });
                        }
                    };
                }
            },
            {
                title: "3. Full-Scale War for Hums",
                desc: "Warriors holding swords like sticks battle along the frontlines, clashing their blades together with sparks flying.",
                camPos: [0, 12, 28],
                camLookAt: [0, 3, 0],
                setup: () => {
                    worldGround.material.color.setHex(0x5c4d3c);

                    // Barricades
                    const barricadeMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.9 });
                    for (let b = -3; b <= 3; b += 2) {
                        const spike = new THREE.Mesh(new THREE.ConeGeometry(0.4, 4, 6), barricadeMat);
                        spike.position.set(b * 3, 1.5, -2);
                        scene.add(spike);
                    }

                    const smokeParticles = [];
                    const smokeMat = new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, opacity: 0.5 });
                    for (let s = 0; s < 20; s++) {
                        const smk = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), smokeMat);
                        smk.position.set((Math.random() - 0.5) * 25, Math.random() * 8, (Math.random() - 0.5) * 15);
                        scene.add(smk);
                        smokeParticles.push(smk);
                    }

                    const warriors = [];

                    // Frontline Clashing Pair & Ranks
                    for (let col = -2; col <= 2; col++) {
                        // Blue Warrior (Left)
                        const blue = createRobloxR6(0x2a9d8f, 0x1d3557);
                        blue.rig.swordGroup.visible = true;
                        blue.position.set(-1.8, 0, col * 3);
                        blue.rotation.y = Math.PI / 2;
                        scene.add(blue);

                        // Red Warrior (Right)
                        const red = createRobloxR6(0xd90429, 0x2b2d42);
                        red.rig.swordGroup.visible = true;
                        red.position.set(1.8, 0, col * 3);
                        red.rotation.y = -Math.PI / 2;
                        scene.add(red);

                        warriors.push({ blue, red, zIndex: col });
                    }

                    // Sword Clash Sparks
                    const sparkMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                    const clashSparks = [];
                    for (let c = -2; c <= 2; c++) {
                        const spark = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), sparkMat);
                        spark.position.set(0, 3.2, c * 3);
                        scene.add(spark);
                        clashSparks.push(spark);
                    }

                    return {
                        actors: [...warriors.flatMap(w => [w.blue, w.red]), ...smokeParticles, ...clashSparks],
                        update: () => {
                            const time = Date.now() * 0.012;

                            warriors.forEach((w, idx) => {
                                // Arm swinging swords together in direct clash
                                const swing = Math.sin(time + idx * 1.5) * 0.7;
                                
                                w.blue.rig.rightArmGroup.rotation.x = -Math.PI / 2.2 + swing;
                                w.blue.rig.rightArmGroup.rotation.y = -Math.PI / 8;

                                w.red.rig.rightArmGroup.rotation.x = -Math.PI / 2.2 - swing;
                                w.red.rig.rightArmGroup.rotation.y = Math.PI / 8;

                                // Sparks flash on strike point
                                clashSparks[idx].visible = Math.abs(swing) < 0.25;
                            });

                            smokeParticles.forEach(p => {
                                p.position.y += 0.06;
                                if (p.position.y > 10) p.position.y = 1;
                            });
                        }
                    };
                }
            },
            {
                title: "4. Cast Adrift to Save Mohamed",
                desc: "Mohamed's loyal companions push him off the cliff in a wooden barrel into the ocean waves to protect him from approaching enemies.",
                camPos: [0, 14, 32],
                camLookAt: [0, 3, 0],
                setup: () => {
                    worldGround.material.color.setHex(0x006699);

                    const cliff = new THREE.Mesh(
                        new THREE.BoxGeometry(18, 10, 16),
                        new THREE.MeshStandardMaterial({ color: 0x4a4e69 })
                    );
                    cliff.position.set(-18, 4, -5);
                    scene.add(cliff);

                    const castle = new THREE.Mesh(
                        new THREE.BoxGeometry(12, 12, 10),
                        new THREE.MeshStandardMaterial({ color: 0x8d99ae })
                    );
                    castle.position.set(-18, 15, -5);
                    scene.add(castle);

                    const enemyGuards = [];
                    for (let i = 0; i < 3; i++) {
                        const enemy = createRobloxR6(0xd90429, 0x111111);
                        enemy.position.set(-23 + i * 2, 9, -6 + i * 2);
                        enemy.rotation.y = Math.PI / 2;
                        enemy.rig.swordGroup.visible = true;
                        scene.add(enemy);
                        enemyGuards.push(enemy);
                    }

                    const ally1 = createRobloxR6(0x2a9d8f, 0x1d3557);
                    ally1.position.set(-12, 9, -2);
                    ally1.rotation.y = Math.PI / 2;

                    const ally2 = createRobloxR6(0x2a9d8f, 0x1d3557);
                    ally2.position.set(-12, 9, 2);
                    ally2.rotation.y = Math.PI / 2;

                    scene.add(ally1, ally2);

                    const barrelGroup = new THREE.Group();
                    const barrel = new THREE.Mesh(
                        new THREE.CylinderGeometry(1.8, 1.8, 3.6, 14),
                        new THREE.MeshStandardMaterial({ color: 0x6f4e37, roughness: 0.7 })
                    );
                    barrelGroup.add(barrel);

                    const head = new THREE.Mesh(
                        new THREE.BoxGeometry(1.1, 1.1, 1.1),
                        new THREE.MeshStandardMaterial({ color: 0xf5cd2f })
                    );
                    head.position.y = 2.1;
                    barrelGroup.add(head);

                    barrelGroup.position.set(-10, 10.8, 0);
                    scene.add(barrelGroup);

                    const splashes = [];
                    const splashMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
                    for (let i = 0; i < 10; i++) {
                        const sp = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), splashMat);
                        sp.visible = false;
                        scene.add(sp);
                        splashes.push(sp);
                    }

                    let timeAcc = 0;
                    return {
                        actors: [cliff, castle, ...enemyGuards, ally1, ally2, barrelGroup, ...splashes],
                        update: () => {
                            timeAcc += 0.025;

                            enemyGuards.forEach(e => {
                                if (e.position.x < -16) e.position.x += 0.04;
                            });

                            if (barrelGroup.position.x < -7) {
                                ally1.rig.leftArmGroup.rotation.x = -Math.PI / 2;
                                ally1.rig.rightArmGroup.rotation.x = -Math.PI / 2;
                                ally2.rig.leftArmGroup.rotation.x = -Math.PI / 2;
                                ally2.rig.rightArmGroup.rotation.x = -Math.PI / 2;

                                ally1.position.x += 0.025;
                                ally2.position.x += 0.025;
                                barrelGroup.position.x += 0.025;
                            } else if (barrelGroup.position.y > 0.8) {
                                barrelGroup.position.x += 0.12;
                                barrelGroup.position.y -= 0.25;
                                barrelGroup.rotation.z -= 0.12;

                                if (barrelGroup.position.y <= 1.2) {
                                    splashes.forEach((sp) => {
                                        sp.visible = true;
                                        sp.position.set(barrelGroup.position.x + (Math.random() - 0.5) * 3, 1 + Math.random() * 2, (Math.random() - 0.5) * 3);
                                    });
                                }
                            } else {
                                splashes.forEach(sp => sp.visible = false);
                                barrelGroup.position.x += 0.07;
                                barrelGroup.position.y = 0.6 + Math.sin(timeAcc * 2.5) * 0.35;
                                barrelGroup.rotation.z = Math.sin(timeAcc * 1.5) * 0.25;
                            }
                        }
                    };
                }
            },
            {
                title: "5. Arrival in Ginga (Texas)",
                desc: "Washing ashore on the desert beach of Ginga, Mohamed breaks free from the barrel and bonds with Alizar.",
                camPos: [0, 8, 20],
                camLookAt: [0, 2, 0],
                setup: () => {
                    worldGround.material.color.setHex(0xe0a96d);

                    const b1 = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 1.8, 8, 1, false, 0, Math.PI), new THREE.MeshStandardMaterial({ color: 0x6f4e37 }));
                    b1.position.set(-6, 0.8, 0);
                    b1.rotation.z = Math.PI / 2;

                    const mohamed = createRobloxR6(0x2a9d8f, 0x264653);
                    mohamed.position.set(-5, 0, 0);

                    const alizar = createRobloxR6(0xf4a261, 0x6b705c);
                    alizar.position.set(7, 0, 0);

                    scene.add(b1, mohamed, alizar);

                    return {
                        actors: [b1, mohamed, alizar],
                        update: () => {
                            animateBotWalking(mohamed, -1.2, 0, 0.05);
                            const active = animateBotWalking(alizar, 1.2, 0, 0.05);
                            if (!active) {
                                mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2.5;
                                alizar.rig.rightArmGroup.rotation.x = -Math.PI / 2.5;
                            }
                        }
                    };
                }
            },
            {
                title: "6. A&M Snack Boom (Chocolate Trade)",
                desc: "Zoomed out view of A&M Snacks shop: Mohamed and Alizar give chocolate bars while customers hand over green cash notes in return.",
                camPos: [0, 14, 32], // Zoomed out camera
                camLookAt: [0, 2.5, 0],
                setup: () => {
                    worldGround.material.color.setHex(0xdda15e);

                    const shop = new THREE.Mesh(
                        new THREE.BoxGeometry(12, 6, 6),
                        new THREE.MeshStandardMaterial({ color: 0x8b5a2b })
                    );
                    shop.position.set(0, 3, -4);

                    const roof = new THREE.Mesh(
                        new THREE.ConeGeometry(10, 4, 4),
                        new THREE.MeshStandardMaterial({ color: 0xb0411b })
                    );
                    roof.position.set(0, 8, -4);
                    roof.rotation.y = Math.PI / 4;

                    const counter = new THREE.Mesh(
                        new THREE.BoxGeometry(10, 1.8, 1.2),
                        new THREE.MeshStandardMaterial({ color: 0x5c3d1e })
                    );
                    counter.position.set(0, 0.9, 0.2);

                    const sign = new THREE.Mesh(new THREE.BoxGeometry(7, 1.4, 0.3), new THREE.MeshStandardMaterial({ color: 0xffd166 }));
                    sign.position.set(0, 5, -0.8);
                    scene.add(shop, roof, counter, sign);

                    // Materials for Chocolate and Green Money
                    const chocMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.3 });
                    const moneyMat = new THREE.MeshStandardMaterial({ color: 0x2b9348, roughness: 0.5 });

                    // Mohamed (Left Seller)
                    const mohamed = createRobloxR6(0x2a9d8f, 0x264653);
                    mohamed.position.set(-2.5, 0, -1);
                    scene.add(mohamed);

                    const choc1 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.8), chocMat);
                    choc1.position.set(0, -1.8, 0.5);
                    mohamed.rig.rightArmGroup.add(choc1);

                    // Alizar (Right Seller)
                    const alizar = createRobloxR6(0xf4a261, 0x6b705c);
                    alizar.position.set(2.5, 0, -1);
                    scene.add(alizar);

                    const choc2 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.8), chocMat);
                    choc2.position.set(0, -1.8, 0.5);
                    alizar.rig.rightArmGroup.add(choc2);

                    // Customers trading
                    const customerLeft = createRobloxR6(0xee9b00, 0x005f73);
                    customerLeft.position.set(-2.5, 0, 2);
                    customerLeft.rotation.y = Math.PI;

                    const money1 = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.08, 0.35), moneyMat);
                    money1.position.set(0, -1.8, 0.5);
                    customerLeft.rig.rightArmGroup.add(money1);

                    const customerRight = createRobloxR6(0xca6702, 0x0a9396);
                    customerRight.position.set(2.5, 0, 2);
                    customerRight.rotation.y = Math.PI;

                    const money2 = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.08, 0.35), moneyMat);
                    money2.position.set(0, -1.8, 0.5);
                    customerRight.rig.rightArmGroup.add(money2);

                    scene.add(customerLeft, customerRight);

                    let tradeTimer = 0;

                    return {
                        actors: [shop, roof, counter, sign, mohamed, alizar, customerLeft, customerRight],
                        update: () => {
                            tradeTimer += 0.04;
                            const tradeAction = Math.sin(tradeTimer);

                            // Mohamed & Alizar reaching forward with chocolate bars
                            mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2.5 + tradeAction * 0.15;
                            alizar.rig.rightArmGroup.rotation.x = -Math.PI / 2.5 + tradeAction * 0.15;

                            // Customers holding out green money rectangles
                            customerLeft.rig.rightArmGroup.rotation.x = -Math.PI / 2.2 - tradeAction * 0.15;
                            customerRight.rig.rightArmGroup.rotation.x = -Math.PI / 2.2 - tradeAction * 0.15;
                        }
                    };
                }
            },
            {
                title: "7. Corruption and Destruction",
                desc: "Corrupt enforcers ignite the shop with fire torches, causing the wooden structure to char into dark ashes amidst rising flames.",
                camPos: [0, 10, 24],
                camLookAt: [0, 3, 0],
                setup: () => {
                    worldGround.material.color.setHex(0x1a1510);

                    const shopMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 });
                    const shop = new THREE.Mesh(new THREE.BoxGeometry(11, 5.5, 6), shopMat);
                    shop.position.set(0, 2.75, -4);

                    const roofMat = new THREE.MeshStandardMaterial({ color: 0xb0411b });
                    const roof = new THREE.Mesh(new THREE.ConeGeometry(9, 3.5, 4), roofMat);
                    roof.position.set(0, 7.25, -4);
                    roof.rotation.y = Math.PI / 4;
                    scene.add(shop, roof);

                    const corruptOfficial = createRobloxR6(0x111111, 0x000000);
                    corruptOfficial.position.set(6, 0, 1);
                    corruptOfficial.rotation.y = -Math.PI / 3;
                    scene.add(corruptOfficial);

                    const torch = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2), new THREE.MeshStandardMaterial({ color: 0x3d2314 }));
                    corruptOfficial.rig.rightArmGroup.add(torch);
                    corruptOfficial.rig.rightArmGroup.rotation.x = -Math.PI / 2.5;

                    const fireLight = new THREE.PointLight(0xff5500, 4, 35);
                    fireLight.position.set(0, 5, -4);
                    scene.add(fireLight);

                    const fireParticles = [];
                    const cols = [0xff1100, 0xff6600, 0xffcc00, 0x333333];
                    for (let i = 0; i < 45; i++) {
                        const p = new THREE.Mesh(
                            new THREE.BoxGeometry(0.5, 0.5, 0.5),
                            new THREE.MeshBasicMaterial({ color: cols[i % cols.length] })
                        );
                        p.position.set((Math.random() - 0.5) * 10, Math.random() * 6, -4 + (Math.random() - 0.5) * 4);
                        scene.add(p);
                        fireParticles.push(p);
                    }

                    let burnTime = 0;
                    return {
                        actors: [shop, roof, corruptOfficial, fireLight, ...fireParticles],
                        update: () => {
                            burnTime += 0.008;
                            fireLight.intensity = 3 + Math.sin(burnTime * 30) * 1.8;

                            if (burnTime < 1.0) {
                                shopMat.color.lerp(new THREE.Color(0x1a1a1a), 0.015);
                                roofMat.color.lerp(new THREE.Color(0x111111), 0.015);
                            }

                            fireParticles.forEach(p => {
                                p.position.y += 0.14;
                                p.scale.multiplyScalar(0.965);
                                if (p.position.y > 9 || p.scale.x < 0.08) {
                                    p.position.y = 0.5;
                                    p.position.x = (Math.random() - 0.5) * 10;
                                    p.position.z = -4 + (Math.random() - 0.5) * 4;
                                    p.scale.set(1, 1, 1);
                                }
                            });
                        }
                    };
                }
            },
            {
                title: "8. Becoming a Mirja",
                desc: "Rising above hardship, Mohamed takes his place as a revered Mirja, leading his followers with wisdom, peace, and spiritual light.",
                camPos: [0, 10, 26],
                camLookAt: [0, 3, 0],
                setup: () => {
                    worldGround.material.color.setHex(0x52b788);

                    const podium = new THREE.Mesh(
                        new THREE.CylinderGeometry(4.5, 5.5, 2.2, 12),
                        new THREE.MeshStandardMaterial({ color: 0xf8f9fa, roughness: 0.2 })
                    );
                    podium.position.set(0, 1.1, -2);
                    scene.add(podium);

                    const auraLight = new THREE.PointLight(0xffd700, 3, 20);
                    auraLight.position.set(0, 5, -2);
                    scene.add(auraLight);

                    const mohamed = createRobloxR6(0xffffff, 0xffffff, 0xf5cd2f);
                    mohamed.position.set(0, 2.2, -2);
                    scene.add(mohamed);

                    const followers = [];
                    for (let i = -3; i <= 3; i++) {
                        if (i === 0) continue;
                        const follower = createRobloxR6(0x74c69d, 0x1b4332);
                        follower.position.set(i * 3.2, 0, 4);
                        follower.rotation.y = Math.PI;
                        scene.add(follower);
                        followers.push(follower);
                    }

                    let time = 0;
                    return {
                        actors: [podium, auraLight, mohamed, ...followers],
                        update: () => {
                            time += 0.02;
                            auraLight.intensity = 2.5 + Math.sin(time * 3) * 1.2;
                            mohamed.rig.leftArmGroup.rotation.x = -Math.PI / 2.5;
                            mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2.5;

                            followers.forEach((f, idx) => {
                                f.rig.leftArmGroup.rotation.x = -Math.PI / 3 + Math.sin(time + idx) * 0.15;
                            });
                        }
                    };
                }
            }
        ];

        let currentSceneIndex = 0;
        let activeSceneInstance = null;
        let autoPlay = true;
        let autoPlayTimer = null;

        function clearCurrentScene() {
            if (activeSceneInstance && activeSceneInstance.actors) {
                activeSceneInstance.actors.forEach(actor => scene.remove(actor));
            }
            for (let i = scene.children.length - 1; i >= 0; i--) {
                const child = scene.children[i];
                if (child !== worldGround && child !== grid && child !== sun && child.type !== 'AmbientLight') {
                    scene.remove(child);
                }
            }
        }

        function loadScene(index) {
            clearCurrentScene();
            currentSceneIndex = index;

            const data = storyData[index];
            document.getElementById('scene-title').innerText = data.title;
            document.getElementById('scene-description').innerText = data.desc;
            document.getElementById('scene-counter').innerText = `SCENE ${index + 1} / ${storyData.length}`;

            camera.position.set(...data.camPos);
            camera.lookAt(...data.camLookAt);

            activeSceneInstance = data.setup();

            if (autoPlay) {
                resetAutoPlayTimer();
            }
        }

        function nextScene() {
            const nextIdx = (currentSceneIndex + 1) % storyData.length;
            loadScene(nextIdx);
        }

        function prevScene() {
            const prevIdx = (currentSceneIndex - 1 + storyData.length) % storyData.length;
            loadScene(prevIdx);
        }

        function toggleAutoPlay() {
            autoPlay = !autoPlay;
            document.getElementById('autoplay-btn').innerText = `Autoplay: ${autoPlay ? 'ON' : 'OFF'}`;
            if (autoPlay) resetAutoPlayTimer();
            else if (autoPlayTimer) clearTimeout(autoPlayTimer);
        }

        function resetAutoPlayTimer() {
            if (autoPlayTimer) clearTimeout(autoPlayTimer);
            autoPlayTimer = setTimeout(() => {
                if (autoPlay) nextScene();
            }, 14000);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (activeSceneInstance && activeSceneInstance.update) {
                activeSceneInstance.update();
            }
            renderer.render(scene, camera);
        }

        loadScene(0);
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Journey of Mohamed - Interactive 3D Storyboard</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050811;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        #story-ui {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            max-width: none;
            box-sizing: border-box;
            padding: 10px 22px 13px;
            background: linear-gradient(
                to bottom,
                rgba(5, 8, 17, 0.02) 0%,
                rgba(5, 8, 17, 0.34) 18%,
                rgba(5, 8, 17, 0.78) 58%,
                rgba(5, 8, 17, 0.93) 100%
            );
            backdrop-filter: blur(4px);
            border: 0;
            border-top: 1px solid rgba(255,255,255,0.10);
            border-radius: 0;
            box-shadow: 0 -8px 25px rgba(0,0,0,0.22);
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-areas:
                "progress progress"
                "info controls";
            align-items: end;
            column-gap: 18px;
            row-gap: 5px;
            z-index: 10;
            pointer-events: none;
        }

        .scene-info {
            grid-area: info;
            min-width: 0;
            padding: 0 0 2px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }

        #progress-bar-container {
            grid-area: progress;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            overflow: hidden;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00c6ff, #ffcc00);
            transition: width 0.1s linear;
        }

        #scene-title {
            margin: 0;
            font-size: 21px;
            color: #ffcc00;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(255, 204, 0, 0.5);
        }

        #scene-description {
            margin: 2px 0 0;
            font-size: 14px;
            line-height: 1.42;
            color: rgba(245,245,245,0.92);
            min-height: 0;
            max-width: 1100px;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 3;
            overflow: hidden;
        }

        .controls-row {
            grid-area: controls;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            border-top: 0;
            padding-top: 0;
            pointer-events: auto;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            padding: 9px 16px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00c6ff;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            background: #00c6ff;
            color: #000;
            box-shadow: 0 0 12px #00c6ff;
        }

        #scene-counter {
            font-family: monospace;
            font-size: 13px;
            color: #aaa;
        }
        @media (max-width: 700px) {
            #story-ui {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "progress"
                    "info"
                    "controls";
                row-gap: 4px;
            }

            .controls-row {
                justify-content: space-between;
            }

            #scene-description {
                -webkit-line-clamp: 2;
            }
        }

    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="story-ui">
        <div id="progress-bar-container">
            <div id="progress-bar"></div>
        </div>
        <div class="scene-info">
            <h2 id="scene-title">Loading World...</h2>
            <p id="scene-description">Building scene...</p>
        </div>
        <div class="controls-row">
            <span id="scene-counter">SCENE 1 / 8</span>
            <div class="btn-group">
                <button onclick="prevScene()">◄ Prev</button>
                <button id="autoplay-btn" onclick="toggleAutoPlay()">Autoplay: ON</button>
                <button id="narrator-btn" onclick="toggleNarrator()">Narrator: ON</button>
                <button onclick="nextScene()">Next ►</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const SCENE_DURATION_MS = 16000;
        // Each scene gets enough time for its title + caption to be narrated.
        // Longer captions automatically receive more screen time; a small
        // minimum keeps short scenes from feeling rushed.
        function getSceneDurationMs(index) {
            const data = storyData[index];
            if (!data) return SCENE_DURATION_MS;
            const words = `${data.title} ${data.desc}`.trim().split(/\s+/).length;
            const byWords = 1500 + words * 440;
            return Math.max(SCENE_DURATION_MS, Math.min(28000, byWords));
        }
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x5ca988);
        scene.fog = new THREE.FogExp2(0x5ca988, 0.008);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const sun = new THREE.DirectionalLight(0xffffff, 1.4);
        sun.position.set(40, 80, 40);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        scene.add(sun);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const worldGround = new THREE.Mesh(
            new THREE.BoxGeometry(500, 2, 500),
            new THREE.MeshStandardMaterial({ color: 0x5ca988, roughness: 0.9 })
        );
        worldGround.position.y = -1;
        worldGround.receiveShadow = true;
        scene.add(worldGround);

        // Sign Texture Helper
        function createSignTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#e5a93b';
            ctx.fillRect(0, 0, 512, 128);
            ctx.strokeStyle = '#3d2314';
            ctx.lineWidth = 12;
            ctx.strokeRect(6, 6, 500, 116);
            ctx.fillStyle = '#222';
            ctx.font = '900 48px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 64);
            return new THREE.CanvasTexture(canvas);
        }

        // Exact Blocky R6 Character Model
        function createRobloxR6(opts = {}, legacyLegColor, legacyHeadColor, legacyAccessoryType) {
            // Preserve Index 10's object-style API while supporting the positional
            // calls used by the transplanted Index 9 scenes.
            if (typeof opts !== 'object' || opts === null) {
                opts = {
                    shirtColor: opts,
                    legColor: legacyLegColor,
                    headColor: legacyHeadColor,
                    accessoryType: legacyAccessoryType
                };
            }
            const {
                shirtColor = 0x5bc0be,
                legColor = 0x2b2d42,
                headColor = 0xf5cd2f,
                accessoryType = null,
                isChild = false,
                weapon = null
            } = opts;

            const avatar = new THREE.Group();
            const scaleFactor = isChild ? 0.7 : 1;
            avatar.scale.set(scaleFactor, scaleFactor, scaleFactor);

            const torsoMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.5 });
            const headMat = new THREE.MeshStandardMaterial({ color: headColor, roughness: 0.3 });
            const legMat = new THREE.MeshStandardMaterial({ color: legColor, roughness: 0.6 });
            const armMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.5 });
            const steelMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.85, roughness: 0.25 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.2 });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), torsoMat);
            torso.position.y = 3;
            torso.castShadow = true;
            avatar.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), headMat);
            head.position.y = 4.6;
            head.castShadow = true;
            avatar.add(head);

            // Simple Face
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.22, 0.05), eyeMat);
            eyeL.position.set(-0.3, 4.7, 0.61);
            const eyeR = eyeL.clone();
            eyeR.position.x = 0.3;
            avatar.add(eyeL, eyeR);

            if (accessoryType === 'helmet') {
                const helmet = new THREE.Mesh(new THREE.BoxGeometry(1.38, 0.65, 1.38), steelMat);
                helmet.position.y = 5.15;
                avatar.add(helmet);
            } else if (accessoryType === 'crown') {
                const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.65, 0.55, 6), goldMat);
                crown.position.y = 5.3;
                avatar.add(crown);
            } else if (accessoryType === 'oooga_mask') {
                const mask = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.3, 0.2), new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
                mask.position.set(0, 4.6, 0.65);
                avatar.add(mask);
            }

            // Arms
            const leftArmGroup = new THREE.Group();
            leftArmGroup.position.set(-1.5, 4, 0);
            const leftArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), armMat);
            leftArm.position.y = -1;
            leftArm.castShadow = true;
            leftArmGroup.add(leftArm);
            avatar.add(leftArmGroup);

            const rightArmGroup = new THREE.Group();
            rightArmGroup.position.set(1.5, 4, 0);
            const rightArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), armMat);
            rightArm.position.y = -1;
            rightArm.castShadow = true;
            rightArmGroup.add(rightArm);
            avatar.add(rightArmGroup);

            if (weapon === 'sword') {
                const swordGroup = new THREE.Group();
                swordGroup.position.set(0, -1.8, 0.2);
                swordGroup.rotation.x = Math.PI / 2.2;
                const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8), new THREE.MeshStandardMaterial({ color: 0x222222 }));
                const hilt = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.12, 0.25), goldMat);
                hilt.position.y = 0.4;
                const blade = new THREE.Mesh(new THREE.BoxGeometry(0.18, 2.8, 0.3), steelMat);
                blade.position.y = 1.8;
                swordGroup.add(handle, hilt, blade);
                rightArmGroup.add(swordGroup);
            } else if (weapon === 'spear') {
                const spearGroup = new THREE.Group();
                const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 5), new THREE.MeshStandardMaterial({ color: 0x5c3d1e }));
                const tip = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.8, 4), steelMat);
                tip.position.y = 2.5;
                spearGroup.add(shaft, tip);
                spearGroup.position.set(0, -1, 0.5);
                spearGroup.rotation.x = Math.PI / 3;
                rightArmGroup.add(spearGroup);
            } else if (weapon === 'torch') {
                const torchGroup = new THREE.Group();
                const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2.5), new THREE.MeshStandardMaterial({ color: 0x3d2314 }));
                const flame = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.4), new THREE.MeshBasicMaterial({ color: 0xff4500 }));
                flame.position.y = 1.4;
                torchGroup.add(handle, flame);
                torchGroup.position.set(0, -1, 0.4);
                torchGroup.rotation.x = Math.PI / 4;
                rightArmGroup.add(torchGroup);
            }

            // Legs
            const leftLegGroup = new THREE.Group();
            leftLegGroup.position.set(-0.55, 2, 0);
            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 1), legMat);
            leftLeg.position.y = -1;
            leftLeg.castShadow = true;
            leftLegGroup.add(leftLeg);
            avatar.add(leftLegGroup);

            const rightLegGroup = new THREE.Group();
            rightLegGroup.position.set(0.55, 2, 0);
            const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 1), legMat);
            rightLeg.position.y = -1;
            rightLeg.castShadow = true;
            rightLegGroup.add(rightLeg);
            avatar.add(rightLegGroup);

            avatar.rig = { leftArmGroup, rightArmGroup, leftLegGroup, rightLegGroup, torso, head };
            avatar.walkCycleTime = Math.random() * 10;
            return avatar;
        }

        // Cacao Tree as shown in user screenshot
        function createExactCacaoTree(x, z) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(1.2, 1.5, 12, 16),
                new THREE.MeshStandardMaterial({ color: 0x5a3825, roughness: 0.9 })
            );
            trunk.position.y = 6;
            trunk.castShadow = true;

            const crown = new THREE.Mesh(
                new THREE.SphereGeometry(6, 18, 18),
                new THREE.MeshStandardMaterial({ color: 0x1d4d38, roughness: 0.8 })
            );
            crown.position.y = 12;
            crown.castShadow = true;

            tree.add(trunk, crown);
            tree.position.set(x, 0, z);
            return tree;
        }

        function createCacaoCrate(x, z) {
            const crateGroup = new THREE.Group();
            const crate = new THREE.Mesh(
                new THREE.BoxGeometry(1.8, 1.2, 1.8),
                new THREE.MeshStandardMaterial({ color: 0x8b5a2b })
            );
            crate.position.y = 0.6;
            crateGroup.add(crate);

            for (let ox = -0.4; ox <= 0.4; ox += 0.8) {
                for (let oz = -0.4; oz <= 0.4; oz += 0.8) {
                    const pod = new THREE.Mesh(
                        new THREE.SphereGeometry(0.35, 8, 8),
                        new THREE.MeshStandardMaterial({ color: 0x6e3619 })
                    );
                    pod.scale.set(0.6, 1.3, 0.6);
                    pod.position.set(ox, 1.4, oz);
                    crateGroup.add(pod);
                }
            }
            crateGroup.position.set(x, 0, z);
            return crateGroup;
        }

        function createWoodenFence(x, z, length) {
            const fence = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x6f4e37 });
            for (let i = 0; i < length; i += 3) {
                const post = new THREE.Mesh(new THREE.BoxGeometry(0.4, 3, 0.4), mat);
                post.position.set(i, 1.5, 0);
                fence.add(post);
            }
            const rail1 = new THREE.Mesh(new THREE.BoxGeometry(length, 0.25, 0.2), mat);
            rail1.position.set(length / 2 - 1.5, 2.2, 0);
            const rail2 = rail1.clone();
            rail2.position.y = 1.0;
            fence.add(rail1, rail2);

            fence.position.set(x, 0, z);
            return fence;
        }

        function animateBotWalking(actor, targetX, targetZ, speed = 0.08) {
            const dx = targetX - actor.position.x;
            const dz = targetZ - actor.position.z;
            const dist = Math.hypot(dx, dz);

            if (dist > 0.3) {
                actor.rotation.y = Math.atan2(dx, dz);
                actor.position.x += (dx / dist) * speed;
                actor.position.z += (dz / dist) * speed;

                actor.walkCycleTime += 0.15;
                const swing = Math.sin(actor.walkCycleTime) * 0.65;
                actor.rig.leftArmGroup.rotation.x = swing;
                actor.rig.rightArmGroup.rotation.x = -swing;
                actor.rig.leftLegGroup.rotation.x = -swing;
                actor.rig.rightLegGroup.rotation.x = swing;
                return true;
            } else {
                actor.rig.leftArmGroup.rotation.x = 0;
                actor.rig.rightArmGroup.rotation.x = 0;
                actor.rig.leftLegGroup.rotation.x = 0;
                actor.rig.rightLegGroup.rotation.x = 0;
                return false;
            }
        }

        function createHorse({ bodyColor = 0x6f4e37, maneColor = 0x2b1b12 } = {}) {
            const horse = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.85 });
            const darkMat = new THREE.MeshStandardMaterial({ color: maneColor, roughness: 0.9 });
            const saddleMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.75 });

            const body = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.5, 1.25), bodyMat);
            body.position.y = 2.05;
            body.castShadow = true;
            horse.add(body);

            const neck = new THREE.Mesh(new THREE.BoxGeometry(0.95, 2.3, 0.9), bodyMat);
            neck.position.set(1.0, 3.25, 0);
            neck.rotation.z = -0.28;
            neck.castShadow = true;
            horse.add(neck);

            const head = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.85, 0.78), bodyMat);
            head.position.set(1.7, 4.0, 0);
            head.rotation.z = -0.05;
            horse.add(head);

            const muzzle = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.45, 0.62), bodyMat);
            muzzle.position.set(2.28, 3.85, 0);
            horse.add(muzzle);

            const earL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.55, 0.25), darkMat);
            const earR = earL.clone();
            earL.position.set(1.42, 4.45, -0.28);
            earR.position.set(1.42, 4.45, 0.28);
            horse.add(earL, earR);

            const mane = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.85, 0.75), darkMat);
            mane.position.set(0.45, 3.45, 0);
            mane.rotation.z = -0.18;
            horse.add(mane);

            const tail = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.5, 0.55), darkMat);
            tail.position.set(-1.65, 2.8, 0);
            tail.rotation.z = 0.65;
            horse.add(tail);

            const saddle = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.22, 1.35), saddleMat);
            saddle.position.set(-0.15, 2.92, 0);
            horse.add(saddle);

            const legPositions = [[-0.95,-0.42],[-0.95,0.42],[0.95,-0.42],[0.95,0.42]];
            const legs = [];
            legPositions.forEach(([x,z])=>{
                const leg = new THREE.Group();
                const upper = new THREE.Mesh(new THREE.BoxGeometry(0.42, 1.45, 0.42), bodyMat);
                upper.position.y = 1.05;
                const hoof = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.28, 0.5), darkMat);
                hoof.position.y = 0.25;
                leg.add(upper, hoof);
                leg.position.set(x,z===0?-0.42:0.42,z);
                horse.add(leg);
                legs.push(leg);
            });
            horse.userData.legs = legs;
            horse.userData.head = head;
            return horse;
        }


        function createMountedWarrior({bodyColor=0x6f4e37, shirtColor=0x2a9d8f, legColor=0x1d3557, headColor=0xf5cd2f, weapon="sword"} = {}) {
            const horse = createHorse({bodyColor});
            const rider = createRobloxR6({shirtColor, legColor, headColor, accessoryType:'helmet', weapon});
            rider.scale.set(0.82,0.82,0.82);
            rider.position.set(-0.2, 1.72, 0);
            rider.rig.leftLegGroup.rotation.z = -0.38;
            rider.rig.rightLegGroup.rotation.z = 0.38;
            rider.rig.leftLegGroup.rotation.x = -0.18;
            rider.rig.rightLegGroup.rotation.x = -0.18;
            horse.add(rider);
            horse.userData.rider = rider;
            return {horse, rider};
        }

        function createArchitecturalCastle() {
            const castle = new THREE.Group();
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x5a626e, roughness: 0.85 });
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x8b263e, roughness: 0.6 });

            const frontWall = new THREE.Mesh(new THREE.BoxGeometry(36, 14, 4), stoneMat);
            frontWall.position.set(0, 7, 0);
            castle.add(frontWall);

            [-18, 18].forEach(tx => {
                const tower = new THREE.Mesh(new THREE.CylinderGeometry(4, 4.5, 20, 12), stoneMat);
                tower.position.set(tx, 10, 0);
                castle.add(tower);

                const towerRoof = new THREE.Mesh(new THREE.ConeGeometry(5, 7, 12), roofMat);
                towerRoof.position.set(tx, 23.5, 0);
                castle.add(towerRoof);
            });

            return castle;
        }

        function createHummusBowl() {
            const bowlGroup = new THREE.Group();
            const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.35, 0.35, 12), new THREE.MeshStandardMaterial({ color: 0xd4a373 }));
            const food = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.3, 0.1, 12), new THREE.MeshStandardMaterial({ color: 0xe9c46a }));
            food.position.y = 0.15;
            bowlGroup.add(bowl, food);
            return bowlGroup;
        }

        function createChocolateBar() {
            return new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.8), new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.4 }));
        }

        function createCashBill() {
            return new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.04, 0.4), new THREE.MeshBasicMaterial({ color: 0x2a9d8f }));
        }

function createTorch(x, y, z) {
            const torchGroup = new THREE.Group();
            torchGroup.position.set(x, y, z);
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 3.2), new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.9 }));
            pole.position.y = 1.6;
            pole.castShadow = true;
            torchGroup.add(pole);

            const light = new THREE.PointLight(0xffaa00, 2.5, 15);
            light.position.y = 3.2;
            torchGroup.add(light);

            const flame = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.65, 0.45), new THREE.MeshBasicMaterial({ color: 0xff4500 }));
            flame.position.y = 3.2;
            torchGroup.add(flame);

            torchGroup.light = light;
            return torchGroup;
        }


        // Extra scene dressing: decorative details added without replacing or removing
        // the original scene objects, animations, or story beats.
        function addSceneDetails(sceneId, props) {
            const add = (obj) => { scene.add(obj); props.push(obj); return obj; };
            const mat = (color, roughness = 0.8, metalness = 0) =>
                new THREE.MeshStandardMaterial({ color, roughness, metalness });

            if (sceneId === 1) {
                // Ground foliage + a few extra cacao pods and baskets.
                for (let i = 0; i < 14; i++) {
                    const tuft = new THREE.Mesh(new THREE.SphereGeometry(0.45 + (i % 3) * 0.12, 8, 6), mat(0x40916c, 1));
                    tuft.scale.set(1.3, 0.45, 1.0);
                    tuft.position.set((i % 7) * 6 - 18, 0.35, (i % 2) * 7 + 5);
                    add(tuft);
                }
                for (let i = 0; i < 6; i++) {
                    const pod = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), mat(0x7f4f24, 0.75));
                    pod.scale.set(0.7, 1.25, 0.7);
                    pod.position.set(-16 + i * 6, 0.55, 9 - (i % 2) * 3);
                    add(pod);
                }
            } else if (sceneId === 2) {
                // Courtyard trim: pennants, serving bowls, and low stone edging.

        function createAlHumsFlag() {
            const g = new THREE.Group();
            const pole = new THREE.Mesh(
                new THREE.CylinderGeometry(0.06, 0.08, 5.5, 8),
                new THREE.MeshStandardMaterial({ color: 0x5b4325, roughness: 0.9 })
            );
            pole.position.y = 2.75;
            g.add(pole);

            const makeTexture = (mirror = false) => {
                const c = document.createElement('canvas');
                c.width = 800; c.height = 360;
                const ctx = c.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, c.width, c.height);
                ctx.strokeStyle = '#9b9b9b';
                ctx.lineWidth = 10;
                ctx.strokeRect(5, 5, c.width - 10, c.height - 10);
                if (mirror) { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
                ctx.fillStyle = '#080808';
                ctx.font = '900 104px Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('AL-HUMS', c.width / 2, c.height / 2 + 4);
                return new THREE.CanvasTexture(c);
            };

            const geo = new THREE.PlaneGeometry(3.2, 1.44);
            const front = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: makeTexture(false), roughness: 0.7, side: THREE.FrontSide }));
            const back = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: makeTexture(true), roughness: 0.7, side: THREE.FrontSide }));
            front.position.set(1.6, 4.45, 0);
            back.position.set(1.6, 4.45, 0);
            back.rotation.y = Math.PI;
            g.add(front, back);
            g.flag = front;
            return g;
        }

                        const bench = new THREE.Mesh(new THREE.BoxGeometry(4, 1.2, 1.5), benchMat);
                        bench.position.set(bx, 0.6, 8);
                        scene.add(bench);
                        props.push(bench);

                        const diner = createRobloxR6(0x00bbf9, 0x111111);
                        diner.position.set(bx, 0.2, 8);
                        diner.rig.leftLegGroup.rotation.x = -Math.PI / 2;
                        diner.rig.rightLegGroup.rotation.x = -Math.PI / 2;
                        scene.add(diner);
                        props.push(diner);
                    });

                    let tradeTimer = 0;
                    return {
                        actors: props,
                        update: () => {
                            tradeTimer += 0.04;
                            const tradeAction = Math.sin(tradeTimer);

                            mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2.5 + tradeAction * 0.15;
                            alizar.rig.rightArmGroup.rotation.x = -Math.PI / 2.5 + tradeAction * 0.15;

                            customerList.forEach((cust, idx) => {
                                cust.rig.rightArmGroup.rotation.x = -Math.PI / 2.2 - Math.sin(tradeTimer + idx) * 0.15;
                            });
                        }
                    };
                }
            },
            {
                title: "21. A&M Snacks Takes Off",
                desc: "A&M Snacks grows into a busy and successful shop. Mohamed and Alizar work side by side, customers keep arriving, and the business begins to look like a thriving part of the community.",
                camPos:[0,10.5,26],camLookAt:[0,3.5,-1],
                setup:()=>{
                    worldGround.material.color.setHex(0xdda15e); scene.fog.color.setHex(0xdda15e);
                    const props=[];
                    const wallMat=new THREE.MeshStandardMaterial({color:0x8b5a2b,roughness:0.8});
                    const trimMat=new THREE.MeshStandardMaterial({color:0xe5a93b,roughness:0.55});
                    const darkMat=new THREE.MeshStandardMaterial({color:0x3d2314,roughness:0.8});
                    const shop=new THREE.Group();
                    const body=new THREE.Mesh(new THREE.BoxGeometry(20,8,6),wallMat);body.position.set(0,4,-8);shop.add(body);
                    const roof=new THREE.Mesh(new THREE.BoxGeometry(21,0.7,6.6),trimMat);roof.position.set(0,8.35,-8);shop.add(roof);
                    const awning=new THREE.Mesh(new THREE.BoxGeometry(18,1.3,1.0),trimMat);awning.position.set(0,6.2,-4.85);shop.add(awning);
                    for(let x=-7.5;x<=7.5;x+=5){const post=new THREE.Mesh(new THREE.BoxGeometry(0.35,5.5,0.35),darkMat);post.position.set(x,3.1,-4.85);shop.add(post);}
                    const sign=new THREE.Mesh(new THREE.BoxGeometry(13,1.5,0.35),darkMat);sign.position.set(0,7.1,-4.7);shop.add(sign);
                    const windowMat=new THREE.MeshBasicMaterial({color:0x18242b});
                    for(let x=-6;x<=6;x+=6){const w=new THREE.Mesh(new THREE.BoxGeometry(4,2.6,0.25),windowMat);w.position.set(x,3.9,-4.9);shop.add(w);}
                    scene.add(shop);props.push(shop);
                    const counter=new THREE.Mesh(new THREE.BoxGeometry(13,1.7,2.2),darkMat);counter.position.set(0,0.85,1.0);scene.add(counter);props.push(counter);
                    const shelves=[];for(let i=0;i<5;i++){const shelf=new THREE.Mesh(new THREE.BoxGeometry(2.0,0.2,1.2),trimMat);shelf.position.set(-8+i*4.0,2.0,0.15);scene.add(shelf);shelves.push(shelf);props.push(shelf);}
                    const goods=[];for(let i=0;i<15;i++){const g=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.45,0.7),new THREE.MeshStandardMaterial({color:i%2?0x6e3619:0x3d2314}));g.position.set(-8+(i%5)*4,2.35+Math.floor(i/5)*0.9,0.15);scene.add(g);goods.push(g);props.push(g);}
                    const mohamed=createRobloxR6({shirtColor:0x90be6d,legColor:0x6b3f1f,headColor:0xf5cd2f,accessoryType:'crown'});mohamed.position.set(-2,0,2.2);scene.add(mohamed);props.push(mohamed);
                    const alizar=createRobloxR6({shirtColor:0xe5a93b,legColor:0x3d2314});alizar.position.set(2,0,2.2);scene.add(alizar);props.push(alizar);
                    const customers=[];for(let i=0;i<7;i++){const c=createRobloxR6({shirtColor:i%2?0xe9c46a:0x74c69d,legColor:0x264653});c.position.set(-10+i*3.2,0,7);scene.add(c);props.push(c);customers.push(c);}
                    const steaming=[];for(let i=0;i<8;i++){const q=new THREE.Mesh(new THREE.SphereGeometry(0.15,6,6),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.35}));q.position.set(-1+(i%4)*0.7,2.3+(i%2)*0.5,2.2);scene.add(q);steaming.push(q);props.push(q);}
                    let t=0;return{actors:props,update:()=>{t+=0.05;customers.forEach((c,i)=>{animateBotWalking(c,-7+(i%5)*3.5,2.2,0.035);c.rig.rightArmGroup.rotation.x=-0.8+Math.sin(t*2+i)*0.2;});mohamed.rig.leftArmGroup.rotation.x=-0.9+Math.sin(t*2)*0.25;alizar.rig.rightArmGroup.rotation.x=-1.0+Math.sin(t*2.4)*0.25;steaming.forEach((q,i)=>{q.position.y=2.2+(i%2)*0.5+Math.abs(Math.sin(t*1.5+i))*0.8;});}};}
            },
                        {
                title: "22. The Threat of Corruption",
                desc: "The success of A&M Snacks is threatened by corrupt forces. Mohamed and Alizar are attacked and brought down, while the burning shop behind them buckles, collapses, and breaks into smoldering debris.",
                camPos: [0, 12, 23], camLookAt: [0, 3.4, -1.5],
                setup: () => {
                    worldGround.material.color.setHex(0x181310);
                    scene.fog.color.setHex(0x1b0000);
                    const props = [];
                    const shopMat = new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 0.95 });
                    const roofMat = new THREE.MeshStandardMaterial({ color: 0x101010, roughness: 0.95 });
                    const woodMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.95 });
                    const shop = new THREE.Group();
                    const body = new THREE.Mesh(new THREE.BoxGeometry(16, 7, 7), shopMat); body.position.set(0, 3.5, -5); shop.add(body);
                    const roof = new THREE.Mesh(new THREE.BoxGeometry(17, 0.8, 7.4), roofMat); roof.position.set(0, 7.4, -5); shop.add(roof);
                    const awning = new THREE.Mesh(new THREE.BoxGeometry(14, 1.2, 1.0), woodMat); awning.position.set(0, 5.9, -1.5); shop.add(awning);
                    const counter = new THREE.Mesh(new THREE.BoxGeometry(13, 1.8, 1.4), woodMat); counter.position.set(0, 0.9, 0.2);
                    const sign = new THREE.Mesh(new THREE.BoxGeometry(10, 1.8, 0.3), new THREE.MeshStandardMaterial({ color: 0x171717, roughness: 0.9 })); sign.position.set(0, 6.1, -1.3);
                    scene.add(shop, counter, sign); props.push(shop, counter, sign);

                    // Fire and smoke
                    const flames = [];
                    const flameMatA = new THREE.MeshBasicMaterial({ color: 0xff4500 });
                    const flameMatB = new THREE.MeshBasicMaterial({ color: 0xffa500 });
                    [[-6,3,-1.1],[-3,5,-1.1],[0,6.7,-1.1],[3,4.3,-1.1],[6,3,-1.1],[-2,8,-5],[4,7.5,-5]].forEach((p,i)=>{
                        const f=new THREE.Mesh(new THREE.BoxGeometry(0.7,1.6+(i%3)*0.3,0.45),i%2?flameMatB:flameMatA);f.position.set(...p);scene.add(f);props.push(f);flames.push(f);
                    });
                    const smoke=[]; const smokeMat=new THREE.MeshBasicMaterial({color:0x222222,transparent:true,opacity:0.28});
                    for(let i=0;i<14;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(0.5+(i%3)*0.2,8,8),smokeMat);p.position.set(-5+(i%6)*2,8+(i%4)*1.1,-5);scene.add(p);props.push(p);smoke.push(p);}
                    const fireLight=new THREE.PointLight(0xff5a00,7,42);fireLight.position.set(0,5,-2);scene.add(fireLight);props.push(fireLight);

                    const mohamed=createRobloxR6({shirtColor:0x90be6d,legColor:0x6b3f1f,headColor:0xf5cd2f,accessoryType:'crown'});mohamed.position.set(-2.6,0,1.5);scene.add(mohamed);props.push(mohamed);
                    const alizar=createRobloxR6({shirtColor:0xe5a93b,legColor:0x3d2314});alizar.position.set(2.6,0,1.5);scene.add(alizar);props.push(alizar);
                    const attacker1=createRobloxR6({shirtColor:0x111111,legColor:0x050505,accessoryType:'helmet',weapon:'spear'});attacker1.position.set(-5,0,1.3);attacker1.rotation.y=Math.PI/2;
                    const attacker2=createRobloxR6({shirtColor:0x111111,legColor:0x050505,accessoryType:'helmet',weapon:'spear'});attacker2.position.set(5,0,1.3);attacker2.rotation.y=-Math.PI/2;
                    scene.add(attacker1,attacker2);props.push(attacker1,attacker2);

                    // Actual shop fragments: these are hidden until the collapse, then fly and tumble down.
                    const fragments=[]; const fragMat=new THREE.MeshStandardMaterial({color:0x090909,roughness:1});
                    for(let r=0;r<3;r++) for(let c=0;c<6;c++){
                        const piece=new THREE.Mesh(new THREE.BoxGeometry(2.5,1.5,2.0),fragMat);
                        piece.position.set(-6.25+c*2.5,1.5+r*2.0,-5);
                        piece.visible=false; scene.add(piece); props.push(piece); fragments.push(piece);
                    }
                    for(let i=0;i<8;i++){
                        const piece=new THREE.Mesh(new THREE.BoxGeometry(1.3,0.45,1.3),fragMat);
                        piece.position.set((i-3.5)*2.2,7.4,-5); piece.visible=false; scene.add(piece);props.push(piece);fragments.push(piece);
                    }
                    fragments.forEach((p,i)=>{p.userData.vx=(i%2?1:-1)*(0.02+Math.random()*0.04);p.userData.vy=0.06+Math.random()*0.08;p.userData.vz=(Math.random()-0.5)*0.03;});

                    let timer=0, fallen=false, collapse=false, collapseT=0;
                    return {actors:props,update:()=>{
                        timer+=0.05;
                        fireLight.intensity=6+Math.sin(timer*18)*2.5;
                        flames.forEach((f,i)=>{f.scale.y=0.75+0.35*Math.abs(Math.sin(timer*8+i));f.rotation.z=Math.sin(timer*6+i)*0.08;});
                        smoke.forEach((p,i)=>{p.position.y+=0.028;if(p.position.y>16)p.position.y=7;});

                        if(!fallen){
                            attacker1.rig.rightArmGroup.rotation.x=-Math.PI/2+Math.sin(timer*12)*0.7;
                            attacker2.rig.rightArmGroup.rotation.x=-Math.PI/2+Math.cos(timer*12)*0.7;
                            mohamed.rig.leftArmGroup.rotation.x=Math.sin(timer*10)*0.35;
                            alizar.rig.leftArmGroup.rotation.x=-Math.sin(timer*10)*0.35;
                            if(timer>5.0) fallen=true;
                        } else {
                            mohamed.rotation.z=Math.min(Math.PI/2,mohamed.rotation.z+0.08);mohamed.position.y=0.5;
                            alizar.rotation.z=Math.max(-Math.PI/2,alizar.rotation.z-0.08);alizar.position.y=0.5;
                            if(timer>6.8) collapse=true;
                        }

                        if(collapse){
                            collapseT=Math.min(1,collapseT+0.035);
                            shop.visible = collapseT<0.18;
                            if(collapseT<0.18){shop.rotation.z += 0.012;}
                            counter.visible = collapseT<0.28;
                            sign.visible = collapseT<0.24;
                            counter.position.y=Math.max(0.35,0.9-collapseT*0.7);
                            sign.position.y=Math.max(0.5,6.1-collapseT*4.2);
                            fragments.forEach((piece,i)=>{
                                if(collapseT>0.08) piece.visible=true;
                                piece.position.x += piece.userData.vx * (0.8+collapseT*2.6);
                                piece.position.y += piece.userData.vy;
                                piece.position.z += piece.userData.vz;
                                piece.userData.vy -= 0.0045;
                                piece.rotation.x += 0.025 + i*0.0003;
                                piece.rotation.z += 0.03;
                                if(piece.position.y<0.35) piece.position.y=0.35;
                            });
                        }
                    }};
                }
            },
            {
                title: "23. Mohamed’s Legacy (The Mirja)",
                desc: "Mohamed's journey becomes a lasting legacy. As a revered mirja, he stands before his people while the community gathers in unity, remembering his courage, leadership, resilience, and the long journey that brought them here.",
                camPos: [0, 14, 32],
                camLookAt: [0, 4, 0],
                skyColor: 0xfffae6,
                setup: () => {
                    worldGround.material.color.setHex(0x52b788);
                    scene.fog.color.setHex(0xfffae6);
                    const props = [];

                    const dais = new THREE.Mesh(new THREE.CylinderGeometry(7, 8, 2.5, 20), new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8 }));
                    dais.position.set(0, 1.25, -2);
                    scene.add(dais);
                    props.push(dais);

                    const auraLight = new THREE.PointLight(0xffd700, 6, 35);
                    auraLight.position.set(0, 6, -2);
                    scene.add(auraLight);
                    props.push(auraLight);

                    const mohamed = createRobloxR6({ shirtColor: 0xffffff, legColor: 0xffffff, headColor: 0xf5cd2f, accessoryType: 'crown' });
                    mohamed.position.set(0, 2.5, -2);
                    scene.add(mohamed);
                    props.push(mohamed);

                    // Massive crowd of followers obeying/bowing
                    const followers = [];
                    for (let x = -16; x <= 16; x += 4) {
                        for (let z = 4; z <= 12; z += 4) {
                            const fol = createRobloxR6({ shirtColor: 0x74c69d, legColor: 0x1b4332 });
                            fol.position.set(x + (Math.random() - 0.5), 0, z);
                            scene.add(fol);
                            followers.push(fol);
                            props.push(fol);
                        }
                    }

                    let t = 0;
                    return {
                        actors: props,
                        update: () => {
                            t += 0.03;
                            auraLight.intensity = 4 + Math.sin(t * 3) * 2;
                            mohamed.rig.leftArmGroup.rotation.x = -Math.PI / 2.2 + Math.sin(t * 2) * 0.1;
                            mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2.2 + Math.sin(t * 2) * 0.1;

                            followers.forEach((f, idx) => {
                                f.rig.torso.rotation.x = Math.PI / 6 + Math.sin(t * 2 + idx) * 0.1;
                            });
                        }
                    };
                }
            }
        ];

        let currentSceneIndex = 0;
        let activeSceneInstance = null;
        let autoPlay = true;
        let narratorEnabled = true;
        let sceneStartTime = Date.now();
        let narratorVoice = null;
        let narratorUnlocked = false;

        function loadNarratorVoice() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            if (!voices.length) return;
            narratorVoice = voices.find(v => /^en(-|_)/i.test(v.lang) && /Natural|Google UK English Male|Google US English|Microsoft David|Microsoft Mark|Daniel|Alex/i.test(v.name))
                || voices.find(v => /^en(-|_)/i.test(v.lang) && /Google|Microsoft|Samantha|Daniel|Alex/i.test(v.name))
                || voices.find(v => /^en(-|_)/i.test(v.lang))
                || voices[0];
        }

        function speakScene(data) {
            if (!narratorEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            loadNarratorVoice();
            const utterance = new SpeechSynthesisUtterance(`${data.title}. ${data.desc}`);
            if (narratorVoice) utterance.voice = narratorVoice;
            utterance.lang = narratorVoice?.lang || 'en-US';
            // Speak briskly enough to finish before the next scene while keeping a natural cadence.
            const wordCount = `${data.title} ${data.desc}`.trim().split(/\s+/).length;
            const targetSeconds = getSceneDurationMs(currentSceneIndex) / 1000 * 0.88;
            const neededRate = wordCount / (targetSeconds * 2.55);
            utterance.rate = Math.min(1.55, Math.max(1.25, neededRate));
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            utterance.onstart = () => { narratorUnlocked = true; };
            window.speechSynthesis.speak(utterance);
        }

        function toggleNarrator() {
            narratorEnabled = !narratorEnabled;
            const btn = document.getElementById('narrator-btn');
            btn.innerText = `Narrator: ${narratorEnabled ? 'ON' : 'OFF'}`;
            if (narratorEnabled) {
                narratorUnlocked = true;
                speakScene(storyData[currentSceneIndex]);
            } else if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadNarratorVoice;
            loadNarratorVoice();
        }

        function clearCurrentScene() {
            if (activeSceneInstance && activeSceneInstance.actors) {
                activeSceneInstance.actors.forEach(actor => scene.remove(actor));
            }
            for (let i = scene.children.length - 1; i >= 0; i--) {
                const child = scene.children[i];
                if (child !== worldGround && child !== sun && child !== ambientLight) {
                    scene.remove(child);
                }
            }
        }

        function loadScene(index) {
            clearCurrentScene();
            currentSceneIndex = index;
            sceneStartTime = Date.now();

            const data = storyData[index];
            document.getElementById('scene-title').innerText = data.title;
            document.getElementById('scene-description').innerText = data.desc;
            document.getElementById('scene-counter').innerText = `SCENE ${index + 1} / ${storyData.length}`;

            camera.position.set(...data.camPos);
            camera.lookAt(...data.camLookAt);

            activeSceneInstance = data.setup();
            speakScene(data);
        }

        function nextScene() {
            loadScene((currentSceneIndex + 1) % storyData.length);
        }

        function prevScene() {
            loadScene((currentSceneIndex - 1 + storyData.length) % storyData.length);
        }

        function toggleAutoPlay() {
            autoPlay = !autoPlay;
            document.getElementById('autoplay-btn').innerText = `Autoplay: ${autoPlay ? 'ON' : 'OFF'}`;
            sceneStartTime = Date.now();
        }

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = Date.now() - sceneStartTime;
            if (autoPlay) {
                const sceneDuration = getSceneDurationMs(currentSceneIndex);
                const progress = Math.min((elapsed / sceneDuration) * 100, 100);
                document.getElementById('progress-bar').style.width = `${progress}%`;

                if (elapsed >= sceneDuration) {
                    nextScene();
                }
            } else {
                document.getElementById('progress-bar').style.width = `0%`;
            }

            if (activeSceneInstance && activeSceneInstance.update) {
                activeSceneInstance.update();
            }

            renderer.render(scene, camera);
        }

        loadScene(0);
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

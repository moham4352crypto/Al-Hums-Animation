<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Journey of Mohamed - Cinematic 3D Storyboard</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020408;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #fff;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        #story-ui {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            background: rgba(8, 12, 20, 0.95);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(0, 198, 255, 0.4);
            border-radius: 14px;
            padding: 22px 28px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 10;
        }

        #scene-title {
            margin: 0;
            font-size: 24px;
            color: #ffcc00;
            letter-spacing: 1.2px;
            text-shadow: 0 0 16px rgba(255, 204, 0, 0.6);
        }

        #scene-description {
            margin: 0;
            font-size: 15px;
            line-height: 1.6;
            color: #e0e6ed;
            min-height: 48px;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.12);
            padding-top: 14px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        button {
            padding: 11px 22px;
            font-size: 13px;
            font-weight: 700;
            color: white;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid #00c6ff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            background: #00c6ff;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 198, 255, 0.8);
            transform: translateY(-2px);
        }

        #scene-counter {
            font-family: 'Courier New', monospace;
            font-size: 15px;
            font-weight: bold;
            color: #00c6ff;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="story-ui">
        <h2 id="scene-title">Initializing World Engine...</h2>
        <p id="scene-description">Building high-density environment models, atmospheric lighting, and dynamic NPC systems...</p>
        <div class="controls-row">
            <span id="scene-counter">SCENE 1 / 8</span>
            <div class="btn-group">
                <button onclick="prevScene()">◄ Prev</button>
                <button id="autoplay-btn" onclick="toggleAutoPlay()">Autoplay: ON</button>
                <button onclick="nextScene()">Next ►</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x4a7c59);
        scene.fog = new THREE.FogExp2(0x4a7c59, 0.008);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        const sun = new THREE.DirectionalLight(0xfffaed, 1.25);
        sun.position.set(70, 110, 50);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 300;
        sun.shadow.camera.left = -80;
        sun.shadow.camera.right = 80;
        sun.shadow.camera.top = 80;
        sun.shadow.camera.bottom = -80;
        scene.add(sun);

        const ambientLight = new THREE.AmbientLight(0x90b0d0, 0.85);
        scene.add(ambientLight);

        const fillLight = new THREE.DirectionalLight(0xddeeff, 0.25);
        fillLight.position.set(-60, 40, -40);
        scene.add(fillLight);

        const worldGround = new THREE.Mesh(
            new THREE.BoxGeometry(500, 2, 500),
            new THREE.MeshStandardMaterial({ color: 0x2b4c2d, roughness: 0.9 })
        );
        worldGround.position.y = -1;
        worldGround.receiveShadow = true;
        scene.add(worldGround);

        // Roblox R6 Rig Builder - Restored with Anti-Glare Matte Head Finish
        function createRobloxR6(shirtColor = 0x00a2ff, legColor = 0x111111, headColor = 0xf5cd2f, accessoryType = null) {
            const avatar = new THREE.Group();
            const torsoMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.6 });
            // Matte finish on head material prevents glare reflections on faces
            const headMat = new THREE.MeshStandardMaterial({ color: headColor, roughness: 1.0, metalness: 0.0, flatShading: true });
            const legMat = new THREE.MeshStandardMaterial({ color: legColor, roughness: 0.7 });
            const armMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.6 });
            const steelMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.3 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.85, roughness: 0.2 });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), torsoMat);
            torso.position.y = 3;
            torso.castShadow = true;
            avatar.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), headMat);
            head.position.y = 4.6;
            head.castShadow = true;
            avatar.add(head);

            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
            const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.25, 0.05), eyeMat);
            eyeL.position.set(-0.3, 4.7, 0.61);
            const eyeR = eyeL.clone();
            eyeR.position.x = 0.3;
            avatar.add(eyeL, eyeR);

            const smile = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.08, 0.05), eyeMat);
            smile.position.set(0, 4.4, 0.61);
            avatar.add(smile);

            if (accessoryType === 'helmet') {
                const helmet = new THREE.Mesh(new THREE.BoxGeometry(1.36, 0.7, 1.36), steelMat);
                helmet.position.y = 5.15;
                helmet.castShadow = true;
                avatar.add(helmet);
                const visor = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.2, 0.4), new THREE.MeshStandardMaterial({ color: 0x111111 }));
                visor.position.set(0, 4.95, 0.55);
                avatar.add(visor);
            } else if (accessoryType === 'crown') {
                const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.65, 0.6, 8), goldMat);
                crown.position.y = 5.35;
                crown.castShadow = true;
                avatar.add(crown);
            } else if (accessoryType === 'hood') {
                const hood = new THREE.Mesh(new THREE.BoxGeometry(1.42, 1.35, 1.42), new THREE.MeshStandardMaterial({ color: shirtColor }));
                hood.position.y = 4.65;
                avatar.add(hood);
            }

            // Left Arm
            const leftArmGroup = new THREE.Group();
            leftArmGroup.position.set(-1.5, 4, 0);
            const leftArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), armMat);
            leftArm.position.y = -1;
            leftArm.castShadow = true;
            leftArmGroup.add(leftArm);
            avatar.add(leftArmGroup);

            // Right Arm
            const rightArmGroup = new THREE.Group();
            rightArmGroup.position.set(1.5, 4, 0);
            const rightArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), armMat);
            rightArm.position.y = -1;
            rightArm.castShadow = true;
            rightArmGroup.add(rightArm);
            avatar.add(rightArmGroup);

            // Sword Attachment
            const swordGroup = new THREE.Group();
            swordGroup.position.set(0, -1.8, 0.2);
            swordGroup.rotation.x = Math.PI / 2.2;
            const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8), new THREE.MeshStandardMaterial({ color: 0x222222 }));
            swordGroup.add(handle);
            const hilt = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.14, 0.28), goldMat);
            hilt.position.y = 0.4;
            swordGroup.add(hilt);
            const blade = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3.0, 0.32), steelMat);
            blade.position.y = 1.9;
            swordGroup.add(blade);
            swordGroup.visible = false;
            rightArmGroup.add(swordGroup);

            // Left Leg
            const leftLegGroup = new THREE.Group();
            leftLegGroup.position.set(-0.55, 2, 0);
            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 1), legMat);
            leftLeg.position.y = -1;
            leftLeg.castShadow = true;
            leftLegGroup.add(leftLeg);
            avatar.add(leftLegGroup);

            // Right Leg
            const rightLegGroup = new THREE.Group();
            rightLegGroup.position.set(0.55, 2, 0);
            const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 1), legMat);
            rightLeg.position.y = -1;
            rightLeg.castShadow = true;
            rightLegGroup.add(rightLeg);
            avatar.add(rightLegGroup);

            avatar.rig = { torso, leftArmGroup, rightArmGroup, leftLegGroup, rightLegGroup, swordGroup };
            avatar.walkCycleTime = Math.random() * 10;
            return avatar;
        }

        function createFallenBody(shirtColor, legColor, headColor, arrowCount = 2) {
            const body = createRobloxR6(shirtColor, legColor, headColor);
            body.rotation.z = Math.PI / 2;
            body.rotation.y = (Math.random() - 0.5) * Math.PI;
            body.position.y = 0.55;

            body.rig.leftArmGroup.rotation.z = 1.3;
            body.rig.rightArmGroup.rotation.x = -1.5;
            body.rig.leftLegGroup.rotation.z = -0.5;
            body.rig.rightLegGroup.rotation.x = 0.7;

            const arrowMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const featherMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee });

            for (let a = 0; a < arrowCount; a++) {
                const arrowGroup = new THREE.Group();
                const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.4), arrowMat);
                const feather = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.45, 0.05), featherMat);
                feather.position.y = 1.1;
                arrowGroup.add(shaft, feather);
                arrowGroup.position.set((Math.random() - 0.5) * 1.3, 3.2, (Math.random() - 0.5) * 0.7);
                arrowGroup.rotation.x = (Math.random() - 0.5) * 0.8;
                arrowGroup.rotation.z = (Math.random() - 0.5) * 0.8;
                body.add(arrowGroup);
            }
            return body;
        }

        function animateBotWalking(actor, targetX, targetZ, speed = 0.08) {
            const dx = targetX - actor.position.x;
            const dz = targetZ - actor.position.z;
            const dist = Math.hypot(dx, dz);

            if (dist > 0.4) {
                actor.rotation.y = Math.atan2(dx, dz);
                actor.position.x += (dx / dist) * speed;
                actor.position.z += (dz / dist) * speed;

                actor.walkCycleTime += 0.16;
                const swing = Math.sin(actor.walkCycleTime) * 0.7;
                actor.rig.leftArmGroup.rotation.x = swing;
                actor.rig.rightArmGroup.rotation.x = -swing;
                actor.rig.leftLegGroup.rotation.x = -swing;
                actor.rig.rightLegGroup.rotation.x = swing;
                return true;
            } else {
                actor.rig.leftArmGroup.rotation.x = 0;
                actor.rig.rightArmGroup.rotation.x = 0;
                actor.rig.leftLegGroup.rotation.x = 0;
                actor.rig.rightLegGroup.rotation.x = 0;
                return false;
            }
        }

        function createTorch(x, y, z) {
            const torchGroup = new THREE.Group();
            torchGroup.position.set(x, y, z);
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.18, 3.4), new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.9 }));
            pole.position.y = 1.7;
            pole.castShadow = true;
            torchGroup.add(pole);

            const light = new THREE.PointLight(0xffaa00, 3.0, 18);
            light.position.y = 3.4;
            torchGroup.add(light);

            const flame = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.75, 0.5), new THREE.MeshBasicMaterial({ color: 0xff4500 }));
            flame.position.y = 3.4;
            torchGroup.add(flame);

            torchGroup.light = light;
            return torchGroup;
        }

        function createWheelbarrow(x, y, z) {
            const barrow = new THREE.Group();
            barrow.position.set(x, y, z);

            const woodMat = new THREE.MeshStandardMaterial({ color: 0x5c3d1e, roughness: 0.8 });
            const ironMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.4 });

            const basin = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.0, 1.6), woodMat);
            basin.position.set(0, 1.1, 0);
            basin.castShadow = true;
            barrow.add(basin);

            const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.2, 16), ironMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(-1.3, 0.7, 0);
            wheel.castShadow = true;
            barrow.add(wheel);

            const h1 = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.15, 0.15), woodMat);
            h1.position.set(0.4, 0.8, -0.6);
            const h2 = h1.clone();
            h2.position.z = 0.6;
            barrow.add(h1, h2);

            return barrow;
        }

        function createArchitecturalCastle() {
            const castle = new THREE.Group();
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x545d68, roughness: 0.85 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x22262c, roughness: 0.9 });
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x8b263e, roughness: 0.5 });
            const windowGlowMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });

            const frontWall = new THREE.Mesh(new THREE.BoxGeometry(36, 14, 3.5), stoneMat);
            frontWall.position.set(0, 7, 0);
            frontWall.castShadow = true;
            frontWall.receiveShadow = true;
            castle.add(frontWall);

            for (let x = -17; x <= 17; x += 3.2) {
                const cren = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.2, 4), stoneMat);
                cren.position.set(x, 15.1, 0);
                cren.castShadow = true;
                castle.add(cren);
            }

            [-18, 18].forEach(tx => {
                const tower = new THREE.Mesh(new THREE.CylinderGeometry(4, 4.6, 22, 14), stoneMat);
                tower.position.set(tx, 11, 0);
                tower.castShadow = true;
                castle.add(tower);

                const towerRoof = new THREE.Mesh(new THREE.ConeGeometry(5.2, 7.5, 14), roofMat);
                towerRoof.position.set(tx, 25.75, 0);
                towerRoof.castShadow = true;
                castle.add(towerRoof);

                for (let wy = 7; wy <= 17; wy += 5) {
                    const win = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2.2, 0.2), windowGlowMat);
                    win.position.set(tx, wy, 4.5);
                    castle.add(win);
                }

                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 4), new THREE.MeshStandardMaterial({ color: 0xdddddd }));
                pole.position.set(tx, 30, 0);
                const flag = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.4, 0.1), new THREE.MeshStandardMaterial({ color: 0x00c6ff }));
                flag.position.set(tx + 1.25, 30.8, 0);
                castle.add(pole, flag);
            });

            const gateFrame = new THREE.Mesh(new THREE.BoxGeometry(7, 9.5, 4), darkMat);
            gateFrame.position.set(0, 4.75, 0);
            castle.add(gateFrame);

            const archDoor = new THREE.Mesh(new THREE.BoxGeometry(5.4, 7.8, 4.2), new THREE.MeshStandardMaterial({ color: 0x3d2314 }));
            archDoor.position.set(0, 3.9, 0);
            castle.add(archDoor);

            return castle;
        }

        const storyData = [
            {
                title: "1. A Childhood Amidst Cacao Fields",
                desc: "Mohamed explores a lush cacao plantation filled with dense foliage, fruit-laden trees, farm baskets, wheelbarrows, fencing, and active plantation workers picking fresh pods.",
                camPos: [-14, 12, 28],
                camLookAt: [0, 4, 0],
                setup: () => {
                    scene.fog.color.setHex(0x4a7c59);
                    scene.background.setHex(0x4a7c59);
                    worldGround.material.color.setHex(0x2d6a4f);
                    const props = [];

                    const mohamed = createRobloxR6(0x2a9d8f, 0x264653, 0xe9c46a);
                    mohamed.position.set(-18, 0, 6);
                    scene.add(mohamed);
                    props.push(mohamed);

                    for (let w = 0; w < 4; w++) {
                        const worker = createRobloxR6(0x52b788, 0x264653);
                        worker.position.set(-12 + w * 9, 0, -8 + (w % 2) * 6);
                        worker.rotation.y = Math.random() * Math.PI * 2;
                        scene.add(worker);
                        props.push(worker);
                    }

                    const treeMat = new THREE.MeshStandardMaterial({ color: 0x4a2e1b, roughness: 0.9 });
                    const leafMat = new THREE.MeshStandardMaterial({ color: 0x1b4332, roughness: 0.6 });
                    const podMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });

                    for (let i = 0; i < 16; i++) {
                        const tree = new THREE.Group();
                        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.8, 14), treeMat);
                        trunk.position.y = 7;
                        tree.add(trunk);

                        const leaves = new THREE.Mesh(new THREE.SphereGeometry(6.5, 10, 10), leafMat);
                        leaves.position.y = 12.5;
                        tree.add(leaves);

                        for (let p = 0; p < 4; p++) {
                            const pod = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), podMat);
                            pod.scale.set(0.6, 1.4, 0.6);
                            pod.position.set((Math.random() - 0.5) * 2, 5 + Math.random() * 4, (Math.random() - 0.5) * 2);
                            tree.add(pod);
                        }

                        const posX = (i % 4) * 14 - 22;
                        const posZ = Math.floor(i / 4) * -14 - 2;
                        tree.position.set(posX, 0, posZ);
                        scene.add(tree);
                        props.push(tree);
                    }

                    // Added farm wheelbarrow and extra baskets
                    const barrow = createWheelbarrow(-10, 0, 8);
                    scene.add(barrow);
                    props.push(barrow);

                    const crateMat = new THREE.MeshStandardMaterial({ color: 0x6e473b });
                    for (let c = 0; c < 6; c++) {
                        const crate = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.8, 2.6), crateMat);
                        crate.position.set(5 + (c % 3) * 3, 0.9, 1 + Math.floor(c / 3) * 3);
                        crate.castShadow = true;
                        scene.add(crate);
                        props.push(crate);

                        for (let p = 0; p < 4; p++) {
                            const pod = new THREE.Mesh(new THREE.SphereGeometry(0.55, 8, 8), podMat);
                            pod.scale.set(0.6, 1.3, 0.6);
                            pod.position.set(crate.position.x + (p % 2 - 0.5) * 0.9, 2.1, crate.position.z + (Math.floor(p / 2) - 0.5) * 0.9);
                            scene.add(pod);
                            props.push(pod);
                        }
                    }

                    for (let f = -26; f <= 26; f += 4) {
                        const post = new THREE.Mesh(new THREE.BoxGeometry(0.4, 3.2, 0.4), crateMat);
                        post.position.set(f, 1.6, 15);
                        const rail = new THREE.Mesh(new THREE.BoxGeometry(4, 0.35, 0.2), crateMat);
                        rail.position.set(f + 2, 2.1, 15);
                        scene.add(post, rail);
                        props.push(post, rail);
                    }

                    const mainPod = new THREE.Mesh(new THREE.SphereGeometry(0.7, 10, 10), podMat);
                    mainPod.scale.set(0.6, 1.4, 0.6);
                    mainPod.position.set(-0.5, 7.0, 1.4);
                    scene.add(mainPod);
                    props.push(mainPod);

                    let grabbed = false;
                    let ticks = 0;

                    return {
                        actors: props,
                        update: () => {
                            ticks += 0.02;
                            const moving = animateBotWalking(mohamed, -1.2, 1.8, 0.065);

                            if (!moving) {
                                if (!grabbed) {
                                    mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 1.3;
                                    if (ticks > 2.5) {
                                        scene.remove(mainPod);
                                        mohamed.rig.rightArmGroup.add(mainPod);
                                        mainPod.position.set(0, -2.0, 0.6);
                                        grabbed = true;
                                    }
                                } else {
                                    mohamed.rotation.y = Math.PI / 4;
                                    mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2.2;
                                    mohamed.rig.rightArmGroup.rotation.y = -Math.PI / 6;
                                    mohamed.rig.leftArmGroup.rotation.x = -Math.PI / 2.5;
                                }
                            }
                        }
                    };
                }
            },
            {
                title: "2. Ascension to Leadership",
                desc: "Mohamed serves steaming stew to a long queue of grateful citizens inside a stone castle courtyard adorned with heraldic banners, glowing torches, banquet tables, and armed guards.",
                camPos: [0, 22, 42],
                camLookAt: [0, 4, 0],
                setup: () => {
                    scene.fog.color.setHex(0x5c6b73);
                    scene.background.setHex(0x5c6b73);
                    worldGround.material.color.setHex(0xd4a373);
                    const props = [];

                    const castleBack = createArchitecturalCastle();
                    castleBack.position.set(0, 0, -14);
                    scene.add(castleBack);
                    props.push(castleBack);

                    const bannerMat = new THREE.MeshStandardMaterial({ color: 0x00c6ff });
                    for (let b = -14; b <= 14; b += 7) {
                        const banner = new THREE.Mesh(new THREE.BoxGeometry(2.2, 8, 0.1), bannerMat);
                        banner.position.set(b, 9, -12.2);
                        scene.add(banner);
                        props.push(banner);
                    }

                    const t1 = createTorch(-12, 0, -12);
                    const t2 = createTorch(12, 0, -12);
                    scene.add(t1, t2);
                    props.push(t1, t2);

                    const tableMat = new THREE.MeshStandardMaterial({ color: 0x5c3d1e });
                    const table = new THREE.Mesh(new THREE.BoxGeometry(12, 1.8, 3.2), tableMat);
                    table.position.set(-6, 0.9, -3);
                    scene.add(table);
                    props.push(table);

                    const foodCauldron = new THREE.Mesh(
                        new THREE.CylinderGeometry(2.0, 1.5, 2.6, 16),
                        new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.85 })
                    );
                    foodCauldron.position.set(-2, 1.3, 0);
                    scene.add(foodCauldron);
                    props.push(foodCauldron);

                    const g1 = createRobloxR6(0x2a9d8f, 0x1d3557, 0xf5cd2f, 'helmet');
                    g1.position.set(-8, 0, 2);
                    g1.rig.swordGroup.visible = true;
                    const g2 = createRobloxR6(0x2a9d8f, 0x1d3557, 0xf5cd2f, 'helmet');
                    g2.position.set(10, 0, 2);
                    g2.rig.swordGroup.visible = true;
                    scene.add(g1, g2);
                    props.push(g1, g2);

                            tradeTimer += 0.04;
                            const tradeAction = Math.sin(tradeTimer);

                            mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2.5 + tradeAction * 0.15;
                            alizar.rig.rightArmGroup.rotation.x = -Math.PI / 2.5 + tradeAction * 0.15;

                            customerList.forEach((cust, idx) => {
                                cust.rig.rightArmGroup.rotation.x = -Math.PI / 2.2 - Math.sin(tradeTimer + idx) * 0.15;
                            });
                        }
                    };
                }
            },
            {
                title: "7. Corruption and Destruction",
                desc: "Corrupt enforcers burn down the snack shop with blazing torches. Charred timber beams crumble amidst raging fire light, flying embers, and thick smoke.",
                camPos: [0, 14, 30],
                camLookAt: [0, 3, 0],
                setup: () => {
                    scene.fog.color.setHex(0x18100c);
                    scene.background.setHex(0x18100c);
                    worldGround.material.color.setHex(0x181310);
                    const props = [];

                    const charredMat = new THREE.MeshStandardMaterial({ color: 0x121212, roughness: 0.95 });
                    const shopBase = new THREE.Mesh(new THREE.BoxGeometry(15, 5.8, 6.8), charredMat);
                    shopBase.position.set(0, 2.9, -4.5);
                    scene.add(shopBase);
                    props.push(shopBase);

                    const woodMat = new THREE.MeshStandardMaterial({ color: 0x2b1a0e, roughness: 0.9 });
                    for (let b = 0; b < 10; b++) {
                        const beam = new THREE.Mesh(new THREE.BoxGeometry(0.75, 8, 0.75), woodMat);
                        beam.position.set((b - 4.5) * 2, 5.2, -4.5);
                        beam.rotation.z = (Math.random() - 0.5) * 1.25;
                        beam.rotation.x = (Math.random() - 0.5) * 0.7;
                        scene.add(beam);
                        props.push(beam);
                    }

                    const counter = new THREE.Mesh(new THREE.BoxGeometry(11, 1.3, 1.3), charredMat);
                    counter.position.set(0, 0.65, 0.2);
                    counter.rotation.z = -0.22;
                    scene.add(counter);
                    props.push(counter);

                    const enforcers = [];
                    const positions = [[-8, 0, 1.5], [8, 0, 1.5], [-3, 0, 5.5], [4, 0, 5.5]];
                    positions.forEach(pos => {
                        const enf = createRobloxR6(0x111111, 0x050505, 0xf5cd2f, 'helmet');
                        enf.position.set(...pos);
                        enf.rotation.y = Math.atan2(-pos[0], -pos[2] - 4.5);
                        
                        const torch = createTorch(0, 0, 0);
                        torch.position.set(0, -1.5, 0.5);
                        torch.scale.set(0.65, 0.65, 0.65);
                        enf.rig.rightArmGroup.add(torch);
                        enf.rig.rightArmGroup.rotation.x = -Math.PI / 2.5;

                        scene.add(enf);
                        enforcers.push(enf);
                        props.push(enf);
                    });

                    const fireLight1 = new THREE.PointLight(0xff4500, 7.5, 40);
                    fireLight1.position.set(-2.5, 4.5, -3.5);
                    const fireLight2 = new THREE.PointLight(0xffaa00, 6.0, 40);
                    fireLight2.position.set(3.5, 3.5, -2.5);
                    scene.add(fireLight1, fireLight2);
                    props.push(fireLight1, fireLight2);

                    const fireParticles = [];
                    const colors = [0xff0000, 0xff4500, 0xffaa00, 0xffff00, 0x222222];
                    
                    for (let i = 0; i < 120; i++) {
                        const size = 0.35 + Math.random() * 0.7;
                        const p = new THREE.Mesh(
                            new THREE.BoxGeometry(size, size, size),
                            new THREE.MeshBasicMaterial({ color: colors[i % colors.length] })
                        );
                        p.position.set((Math.random() - 0.5) * 15, Math.random() * 10, -4.5 + (Math.random() - 0.5) * 6);
                        scene.add(p);
                        fireParticles.push(p);
                        props.push(p);
                    }

                    let burnTime = 0;
                    return {
                        actors: props,
                        update: () => {
                            burnTime += 0.018;

                            fireLight1.intensity = 6 + Math.sin(burnTime * 28) * 3.0;
                            fireLight2.intensity = 5 + Math.cos(burnTime * 20) * 2.5;

                            fireParticles.forEach(p => {
                                p.position.y += 0.2;
                                p.position.x += Math.sin(burnTime + p.position.y) * 0.08;
                                p.scale.multiplyScalar(0.96);

                                if (p.position.y > 13 || p.scale.x < 0.05) {
                                    p.position.y = 0.5;
                                    p.position.x = (Math.random() - 0.5) * 15;
                                    p.position.z = -4.5 + (Math.random() - 0.5) * 6;
                                    p.scale.set(1, 1, 1);
                                }
                            });
                        }
                    };
                }
            },
            {
                title: "8. Becoming a Mirja",
                desc: "Mohamed ascends as a divine leader upon a sacred white marble temple dais framed by tall fluted columns, flanked by golden braziers, glowing aura particles, and bowing followers.",
                camPos: [0, 13, 32],
                camLookAt: [0, 3, 0],
                setup: () => {
                    scene.fog.color.setHex(0x38b000);
                    scene.background.setHex(0x38b000);
                    worldGround.material.color.setHex(0x52b788);
                    const props = [];

                    const pillarMat = new THREE.MeshStandardMaterial({ color: 0xf8f9fa, roughness: 0.1 });
                    for (let p = -14; p <= 14; p += 4.5) {
                        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 15, 16), pillarMat);
                        pillar.position.set(p, 7.5, -7);
                        pillar.castShadow = true;
                        scene.add(pillar);
                        props.push(pillar);
                    }

                    const podium = new THREE.Mesh(
                        new THREE.CylinderGeometry(6, 7.2, 2.6, 24),
                        pillarMat
                    );
                    podium.position.set(0, 1.3, -2);
                    podium.receiveShadow = true;
                    scene.add(podium);
                    props.push(podium);

                    [-7, 7].forEach(bx => {
                        const brazier = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 0.6, 3, 12), new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9 }));
                        brazier.position.set(bx, 1.5, -2);
                        scene.add(brazier);
                        props.push(brazier);

                        const bLight = new THREE.PointLight(0xffaa00, 3, 15);
                        bLight.position.set(bx, 3.5, -2);
                        scene.add(bLight);
                        props.push(bLight);
                    });

                    const auraLight = new THREE.PointLight(0xffd700, 6, 35);
                    auraLight.position.set(0, 5.5, -2);
                    scene.add(auraLight);
                    props.push(auraLight);

                    const sparkles = [];
                    const sparkleMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
                    for (let sp = 0; sp < 55; sp++) {
                        const spark = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28, 0.28), sparkleMat);
                        spark.position.set((Math.random() - 0.5) * 16, Math.random() * 10, -2 + (Math.random() - 0.5) * 9);
                        scene.add(spark);
                        sparkles.push(spark);
                        props.push(spark);
                    }

                    const mohamed = createRobloxR6(0xffffff, 0xffffff, 0xf5cd2f, 'crown');
                    mohamed.position.set(0, 2.6, -2);
                    scene.add(mohamed);
                    props.push(mohamed);

                    const followers = [];
                    for (let i = -5; i <= 5; i++) {
                        if (i === 0) continue;
                        const follower = createRobloxR6(0x74c69d, 0x1b4332);
                        follower.position.set(i * 3.4, 0, 4.5 + (Math.abs(i) % 2) * 2);
                        follower.rotation.y = Math.PI;
                        scene.add(follower);
                        followers.push(follower);
                        props.push(follower);
                    }

                    let time = 0;
                    return {
                        actors: props,
                        update: () => {
                            time += 0.02;
                            auraLight.intensity = 4.5 + Math.sin(time * 3.5) * 2.0;

                            mohamed.rig.leftArmGroup.rotation.x = -Math.PI / 2.4;
                            mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2.4;

                            sparkles.forEach(sp => {
                                sp.position.y += 0.04;
                                if (sp.position.y > 11) sp.position.y = 1;
                            });

                            followers.forEach((f, idx) => {
                                f.rig.leftArmGroup.rotation.x = -Math.PI / 3 + Math.sin(time + idx) * 0.15;
                            });
                        }
                    };
                }
            }
        ];

        let currentSceneIndex = 0;
        let activeSceneInstance = null;
        let autoPlay = true;
        let autoPlayTimer = null;

        function clearCurrentScene() {
            if (activeSceneInstance && activeSceneInstance.actors) {
                activeSceneInstance.actors.forEach(actor => scene.remove(actor));
            }
            for (let i = scene.children.length - 1; i >= 0; i--) {
                const child = scene.children[i];
                if (child !== worldGround && child !== sun && child !== ambientLight && child !== fillLight) {
                    scene.remove(child);
                }
            }
        }

        function loadScene(index) {
            clearCurrentScene();
            currentSceneIndex = index;

            const data = storyData[index];
            document.getElementById('scene-title').innerText = data.title;
            document.getElementById('scene-description').innerText = data.desc;
            document.getElementById('scene-counter').innerText = `SCENE ${index + 1} / ${storyData.length}`;

            camera.position.set(...data.camPos);
            camera.lookAt(...data.camLookAt);

            activeSceneInstance = data.setup();

            if (autoPlay) {
                resetAutoPlayTimer();
            }
        }

        function nextScene() {
            const nextIdx = (currentSceneIndex + 1) % storyData.length;
            loadScene(nextIdx);
        }

        function prevScene() {
            const prevIdx = (currentSceneIndex - 1 + storyData.length) % storyData.length;
            loadScene(prevIdx);
        }

        function toggleAutoPlay() {
            autoPlay = !autoPlay;
            document.getElementById('autoplay-btn').innerText = `Autoplay: ${autoPlay ? 'ON' : 'OFF'}`;
            if (autoPlay) resetAutoPlayTimer();
            else if (autoPlayTimer) clearTimeout(autoPlayTimer);
        }

        function resetAutoPlayTimer() {
            if (autoPlayTimer) clearTimeout(autoPlayTimer);
            autoPlayTimer = setTimeout(() => {
                if (autoPlay) nextScene();
            }, 14000);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (activeSceneInstance && activeSceneInstance.update) {
                activeSceneInstance.update();
            }
            renderer.render(scene, camera);
        }

        loadScene(0);
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
